name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-build:
    name: Web build (frontend check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: apps/readest-app
        run: pnpm build-web

  desktop-build:
    name: Desktop build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows
          - platform: macos-latest
            artifact: macos
          - platform: ubuntu-latest
            artifact: linux
    env:
      # This fork does not configure Tauri signing keys yet. With
      # `createUpdaterArtifacts: true` (upstream default) the bundler would
      # fail because TAURI_SIGNING_PRIVATE_KEY is missing, so we build plain
      # installers only. To enable auto-update artifacts, set the
      # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # secrets and remove this override.
      TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
      # AppImage bundling on Ubuntu 24.04 runners: extract instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app (Tauri)
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readest-${{ matrix.artifact }}
          path: target/release/bundle/**
          if-no-files-found: error
