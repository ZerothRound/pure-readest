name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop build (windows)
    runs-on: windows-latest
    env:
      # This fork does not configure Tauri signing keys yet. With
      # `createUpdaterArtifacts: true` (upstream default) the bundler would
      # fail because TAURI_SIGNING_PRIVATE_KEY is missing, so we build plain
      # installers only. To enable auto-update artifacts, set the
      # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # secrets and remove this override.
      TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup vendors (pdfjs / simplecc / jieba)
        working-directory: apps/readest-app
        run: pnpm setup-vendors

      - name: Build desktop app (Tauri)
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readest-windows
          path: target/release/bundle/**
          if-no-files-found: error
